name: Lint Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/lint-check.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/lint-check.yml"
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: markdown-link-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Run link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --verbose
            --accept 200,206,301,302,429
            --exclude ^https?://
            README.md
            CONTRIBUTING.md
            public/**/*.md
          format: markdown
          output: lychee-report.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lychee-report-${{ github.run_id }}
          path: lychee-report.md
          if-no-files-found: warn
